name: vis-probe
on: workflow_dispatch
permissions:
  packages: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: push 1-byte scratch image
        run: |
          echo probe > f
          printf 'FROM scratch\nCOPY f /\n' > Dockerfile
          docker build -t ghcr.io/${{ github.repository_owner }}/vis-probe:1 .
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push ghcr.io/${{ github.repository_owner }}/vis-probe:1
